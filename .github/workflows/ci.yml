name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `changeset status --since` compares against origin/main.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate theme and build the DS package
        run: pnpm build

      - name: Type check
        run: pnpm -r --if-present typecheck

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Unit and fitness tests
        run: pnpm exec vitest run

      # Fails when a pull request changes a published package without a changeset (`pnpm changeset`).
      - name: Require a changeset
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/main

  # Visual regression job removed until the baselines are regenerated; restore it from git history.
