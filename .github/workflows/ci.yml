name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Read by the .npmrc that setup-node writes for npm.pkg.github.com.
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          # `changeset status --since` compares against origin/main.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@cascade-ds'

      - run: pnpm install --frozen-lockfile

      - name: Generate theme and build the DS package
        run: pnpm build

      - name: Type check
        run: pnpm -r --if-present typecheck

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Unit and fitness tests
        run: pnpm exec vitest run

      - name: Install Chromium for Storybook tests
        run: pnpm --filter @cascade-ds/storybook exec playwright install --with-deps chromium

      - name: Storybook accessibility tests
        run: pnpm test:storybook

      # Fails when a pull request changes a published package without a changeset (`pnpm changeset`).
      - name: Require a changeset
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm changeset status --since=origin/main

  # Visual regression job removed until the baselines are regenerated; restore it from git history.
